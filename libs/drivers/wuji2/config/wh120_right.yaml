optimizer:
  type: "AdaptiveOptimizerAnalytical"
  urdf_path: "../wuji_hand_description/urdf/right.urdf"
  mjcf_path: "../wuji_hand_description/mjcf/right.xml"

retarget:
  huber_delta: 2.0
  huber_delta_dir: 0.5
  norm_delta: 0.04
  w_pos: 1.0
  w_dir: 2.0
  scaling: 1.0
  w_full_hand: 1.0
  thumb_skip_pip: true
  w_hyper: 1.0
  soft_min: 0.0
  w_couple: 0.1
  couple_ratio: 0.7
  lp_alpha: 0.2

  segment_scaling:
    thumb:  [1.1, 1.1, 1.1]
    index:  [1.1, 1.1, 1.1]
    middle: [1.1, 1.1, 1.1]
    ring:   [1.1, 1.1, 1.1]
    pinky:  [1.2, 1.2, 1.2]

  pinch_thresholds:
    index:  { d1: 2.0, d2: 4.0 }
    middle: { d1: 2.0, d2: 4.0 }
    ring:   { d1: 2.0, d2: 4.0 }
    pinky:  { d1: 2.0, d2: 4.0 }
  mediapipe_rotation:
    x: 0.0
    y: 0.0
    z: -90.0
  wrist_offset_cm: [0.06, 0.45, -0.01]
  thumb_offset_cm: [-0.88, -0.81, 0.83]

wuji_glove:
  device_name: "glove"
